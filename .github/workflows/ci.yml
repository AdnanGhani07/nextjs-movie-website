name: CI / Build & Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    env:
      # Build-time dummy environment variables so Next.js build validation passes
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'dummy_tmdb_api_key' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder_anon_key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder_service_role_key' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_gemini_api_key' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'dummy_cron_secret' }}
      NEXT_PUBLIC_URL: "http://localhost:3000"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint code
        run: npm run lint

      - name: 🏷️ TypeScript check
        run: npx tsc --noEmit

      - name: 🏗️ Production build
        run: npm run build
